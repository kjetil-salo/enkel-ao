services:
  enkel-ao:
    build: .
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      # Egen fuglebase fra lokalitetsuttrekket (2026-11), vasket hver natt fra Dagens Funn.
      # /shared/locations.db (Dagens Funn) beholdes urørt som referanse.
      - LOCATION_DB_PATH=/data/locations-fugl.db
      - KART_FRA_LOKAL_DB=1
      - LOG_DIR=/data/logs
    volumes:
      - ao-data:/data
      - shared-locations:/shared
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dozzle:
    image: amir20/dozzle:latest
    restart: always
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./users.yml:/data/users.yml
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_AUTH_PROVIDER: "simple"
      DOZZLE_TAILSIZE: "5000"

volumes:
  ao-data:
  shared-locations:
    external: true
