services:
  enkel-ao-staging:
    build: .
    restart: always
    ports:
      - "3015:3015"
    env_file:
      - .env
    environment:
      # Merker hjemskjerm-ikonet «Enkel-AO-S» og gråtoner det, slik at
      # staging ikke kan forveksles med prod på telefonen.
      - APP_ENV=staging
      - LOCATION_DB_PATH=/shared/locations.db
      - LOG_DIR=/data/logs
    volumes:
      - ./data:/data
      - shared-locations:/shared
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  shared-locations:
    external: true
