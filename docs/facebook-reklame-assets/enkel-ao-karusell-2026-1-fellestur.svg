<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Enkel-AO karusell 1: fellestur</title>
  <desc id="desc">Fellestur i Enkel-AO — gruppa deler en femsifret kode og fører en felles liste. Skjermbildene viser koden og den delte loggen der tre ulike personer har registrert hver sin art.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1b38"/>
      <stop offset="52%" stop-color="#17406f"/>
      <stop offset="100%" stop-color="#0c6b68"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="23" flood-color="#050c18" flood-opacity="0.26"/>
    </filter>

    <!-- Rammemål matcher bildenes egne sideforhold:
         kode  460x245 (1.87755) → 450x240 (1.87500)
         logg3 500x198 (2.52525) → 450x178 (2.52809) -->
    <clipPath id="kodeClip">
      <rect x="570" y="400" width="450" height="240" rx="22" ry="22"/>
    </clipPath>
    <clipPath id="loggClip">
      <rect x="570" y="702" width="450" height="178" rx="22" ry="22"/>
    </clipPath>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="110" cy="170" r="136" fill="#7dd3fc" opacity="0.13"/>
  <circle cx="950" cy="156" r="152" fill="#fde68a" opacity="0.14"/>
  <circle cx="900" cy="1180" r="230" fill="#86efac" opacity="0.12"/>

  <rect x="390" y="56" width="300" height="62" rx="27" ry="27" fill="#ecfeff" opacity="0.96"/>
  <text x="540" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="33" font-weight="800" fill="#12314d">ENKEL-AO</text>

  <text x="76" y="240" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#f8fbff">
    <tspan x="76" dy="0">Slipp at én må</tspan>
    <tspan x="76" dy="68">være sekretær</tspan>
    <tspan x="76" dy="68">hele turen</tspan>
  </text>

  <text x="78" y="470" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#dce8ff">
    <tspan x="78" dy="0">Er dere flere på samme tur, deler</tspan>
    <tspan x="78" dy="42">dere én kode og fører én felles liste.</tspan>
  </text>

  <text x="78" y="590" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#bfe3ff">
    <tspan x="78" dy="0">✓  Alle ser hverandres funn</tspan>
    <tspan x="78" dy="44">✓  Alle kan rette tall</tspan>
    <tspan x="78" dy="44">✓  Én sender alt til AO til slutt</tspan>
    <tspan x="78" dy="44">✓  Medobservatører krediteres</tspan>
  </text>

  <!-- Koden gruppa deler -->
  <g filter="url(#shadow)">
    <image href="screens/enkel-ao-v15338-fellestur-kode.png"
           x="570" y="400" width="450" height="240"
           preserveAspectRatio="xMidYMin meet" clip-path="url(#kodeClip)"/>
    <rect x="570" y="400" width="450" height="240" rx="22" ry="22" fill="none" stroke="#facc15" stroke-width="5"/>
  </g>

  <text x="795" y="678" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#facc15">↓  alle fører i samme liste</text>

  <!-- Den delte loggen: tre arter, tre ulike personer -->
  <g filter="url(#shadow)">
    <image href="screens/enkel-ao-v15338-fellestur-logg3.png"
           x="570" y="702" width="450" height="178"
           preserveAspectRatio="xMidYMin meet" clip-path="url(#loggClip)"/>
    <rect x="570" y="702" width="450" height="178" rx="22" ry="22" fill="none" stroke="#facc15" stroke-width="5"/>
  </g>

  <text x="795" y="940" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#dce8ff">Tre arter, tre personer, én liste.</text>

  <text x="540" y="1130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#9fc4e8">Lokaliteter og artsdata hentes fra artsobservasjoner.no</text>

  <rect x="76" y="1180" width="928" height="86" rx="30" ry="30" fill="#facc15"/>
  <text x="540" y="1234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#13233d">ao.efugl.no  •  gratis, uten reklame</text>
</svg>
