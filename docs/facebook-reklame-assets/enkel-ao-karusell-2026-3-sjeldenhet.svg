<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Enkel-AO karusell 3: sjeldenhetsvarsel</title>
  <desc id="desc">Sjeldenhetsvarselet i Enkel-AO — ekte svar fra Artsobservasjoner om at rosenstare er meget sjelden i Hordaland, vist før observasjonen registreres.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1b38"/>
      <stop offset="52%" stop-color="#17406f"/>
      <stop offset="100%" stop-color="#0c6b68"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="23" flood-color="#050c18" flood-opacity="0.26"/>
    </filter>

    <!-- sjeldenhetsvarsel 500x592 (0.844595) → 470x556 (0.845324) -->
    <clipPath id="varselClip">
      <rect x="550" y="430" width="470" height="556" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="110" cy="170" r="136" fill="#7dd3fc" opacity="0.13"/>
  <circle cx="950" cy="156" r="152" fill="#fde68a" opacity="0.14"/>
  <circle cx="880" cy="1170" r="222" fill="#fbbf24" opacity="0.10"/>

  <rect x="390" y="56" width="300" height="62" rx="27" ry="27" fill="#ecfeff" opacity="0.96"/>
  <text x="540" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="33" font-weight="800" fill="#12314d">ENKEL-AO</text>

  <text x="76" y="268" font-family="Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#f8fbff">
    <tspan x="76" dy="0">«Er denne sjelden</tspan>
    <tspan x="76" dy="76">akkurat her?»</tspan>
  </text>

  <text x="78" y="440" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#dce8ff">
    <tspan x="78" dy="0">Appen sier fra før du registrerer,</tspan>
    <tspan x="78" dy="42">med AOs egen vurdering for arten</tspan>
    <tspan x="78" dy="42">på akkurat den lokaliteten.</tspan>
  </text>

  <text x="78" y="622" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#bfe3ff">
    <tspan x="78" dy="0">✓  Fanger ekte sjeldne funn</tspan>
    <tspan x="78" dy="44">✓  Fanger feiltrykk i artslista</tspan>
    <tspan x="78" dy="44">✓  Nyttig når du er på reise</tspan>
  </text>

  <text x="78" y="810" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#9fc4e8">
    <tspan x="78" dy="0">Vurderingen kommer fra</tspan>
    <tspan x="78" dy="33">Artsobservasjoner, ikke fra appen.</tspan>
    <tspan x="78" dy="33">Krever nett og innlogging.</tspan>
  </text>

  <g filter="url(#shadow)">
    <image href="screens/enkel-ao-v15338-sjeldenhetsvarsel.png"
           x="550" y="430" width="470" height="556"
           preserveAspectRatio="xMidYMin meet" clip-path="url(#varselClip)"/>
    <rect x="550" y="430" width="470" height="556" rx="28" ry="28" fill="none" stroke="#facc15" stroke-width="5"/>
  </g>

  <text x="540" y="1130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#9fc4e8">Lokaliteter og artsdata hentes fra artsobservasjoner.no</text>

  <rect x="76" y="1180" width="928" height="86" rx="30" ry="30" fill="#facc15"/>
  <text x="540" y="1234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#13233d">ao.efugl.no  •  gratis, uten reklame</text>
</svg>
