<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Facebook-plansje for Enkel-AO med bilder og deling</title>
  <desc id="desc">Plansje for Enkel-AO med lyse skjermbilder, bildeopplasting og deling av funn før publisering til Artsobservasjoner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1b38"/>
      <stop offset="52%" stop-color="#17406f"/>
      <stop offset="100%" stop-color="#0c6b68"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef7ff"/>
    </linearGradient>
    <linearGradient id="warmCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf4"/>
      <stop offset="100%" stop-color="#fff1bd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#050c18" flood-opacity="0.26"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#091120" flood-opacity="0.18"/>
    </filter>
    <clipPath id="shareScreen">
      <rect x="688" y="128" width="310" height="565" rx="30" ry="30"/>
    </clipPath>
    <clipPath id="imageScreen">
      <rect x="634" y="720" width="214" height="390" rx="24" ry="24"/>
    </clipPath>
    <clipPath id="listScreen">
      <rect x="872" y="720" width="136" height="248" rx="20" ry="20"/>
    </clipPath>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="108" cy="168" r="138" fill="#7dd3fc" opacity="0.13"/>
  <circle cx="944" cy="158" r="156" fill="#fde68a" opacity="0.14"/>
  <circle cx="900" cy="1168" r="232" fill="#86efac" opacity="0.12"/>
  <circle cx="458" cy="980" r="112" fill="#bfdbfe" opacity="0.08"/>

  <rect x="74" y="54" width="250" height="56" rx="24" ry="24" fill="#ecfeff" opacity="0.96"/>
  <text x="199" y="91" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#12314d">ENKEL-AO</text>

  <text x="76" y="194" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#f8fbff">
    <tspan x="76" dy="0">Enklere vei inn i</tspan>
    <tspan x="76" dy="68">Artsobservasjoner</tspan>
  </text>

  <text x="78" y="338" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#dce8ff">
    <tspan x="78" dy="0">Enkel-AO erstatter ikke AO.</tspan>
    <tspan x="78" dy="39">Det er bare et enklere lag oppå, laget</tspan>
    <tspan x="78" dy="39">for rask registrering og riktig lokalitet.</tspan>
  </text>

  <g filter="url(#softShadow)">
    <rect x="76" y="462" width="500" height="142" rx="30" ry="30" fill="url(#card)"/>
    <text x="112" y="504" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#122844">GPS finner lokalitetene for deg</text>
    <text x="112" y="542" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#52657a">
      <tspan x="112" dy="0">Se aktuelle steder på kart</tspan>
      <tspan x="112" dy="26">eller som enkel liste.</tspan>
    </text>

    <rect x="76" y="626" width="500" height="122" rx="30" ry="30" fill="url(#card)"/>
    <text x="112" y="668" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#122844">Bilder rett inn på observasjonen</text>
    <text x="112" y="706" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#52657a">
      <tspan x="112" dy="0">I redigervinduet kan du ta bilde,</tspan>
      <tspan x="112" dy="26">laste opp eller lime inn.</tspan>
    </text>

    <rect x="76" y="770" width="500" height="122" rx="30" ry="30" fill="url(#warmCard)"/>
    <text x="112" y="812" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#122844">Del funn med venner</text>
    <text x="112" y="850" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#52657a">
      <tspan x="112" dy="0">Lag en lenke til dagens status</tspan>
      <tspan x="112" dy="26">før alt er sendt inn til AO.</tspan>
    </text>
  </g>

  <text x="86" y="958" font-family="Helvetica, Arial, sans-serif" font-size="31" font-weight="800" fill="#f8fbff">
    <tspan x="86" dy="0">Herdla i mange timer?</tspan>
  </text>
  <text x="86" y="1004" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#dce8ff">
    <tspan x="86" dy="0">Hold fuglevennene oppdatert</tspan>
    <tspan x="86" dy="32">mens turen fortsatt pågår.</tspan>
  </text>

  <g filter="url(#shadow)">
    <rect x="688" y="128" width="310" height="565" rx="30" ry="30" fill="#ffffff" stroke="#6ea8ff" stroke-width="5"/>
    <image href="/Users/kjetil/git/enkel-ao/docs/facebook-reklame-assets/screens/enkel-ao-light-share-edit-now.png" x="688" y="128" width="310" height="565" preserveAspectRatio="xMidYMin meet" clip-path="url(#shareScreen)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="634" y="720" width="214" height="390" rx="24" ry="24" fill="#ffffff" stroke="#8be0c8" stroke-width="4"/>
    <image href="/Users/kjetil/git/enkel-ao/docs/facebook-reklame-assets/screens/enkel-ao-light-share-edit-now-2.png" x="634" y="720" width="214" height="390" preserveAspectRatio="xMidYMin meet" clip-path="url(#imageScreen)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="872" y="720" width="136" height="248" rx="20" ry="20" fill="#ffffff" stroke="#8be0c8" stroke-width="4"/>
    <image href="/Users/kjetil/git/enkel-ao/docs/facebook-reklame-assets/screens/enkel-ao-light-share-index-now.png" x="866" y="716" width="148" height="270" preserveAspectRatio="xMidYMin meet" clip-path="url(#listScreen)"/>
  </g>

  <text x="541" y="1192" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#b9d5ed">Bygger på Artsobservasjoner.no</text>

  <rect x="74" y="1230" width="934" height="88" rx="32" ry="32" fill="#facc15"/>
  <text x="541" y="1285" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="33" font-weight="800" fill="#102743">AO i bunnen. Feltdagen delt underveis.</text>
</svg>
