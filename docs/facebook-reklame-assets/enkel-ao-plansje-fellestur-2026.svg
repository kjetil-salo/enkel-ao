<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1315" viewBox="0 0 1080 1315" role="img" aria-labelledby="title desc">
  <title id="title">Facebook-plansje for Enkel-AO: fellestur, sjeldenhetsvarsel og raskere registrering</title>
  <desc id="desc">Plansje for Enkel-AO v1.53.38 med ekte lyse skjermbilder: hovedskjermen med observasjonsliste, fellestur-koden, og den delte loggen der tre ulike personer har registrert hver sin art.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1b38"/>
      <stop offset="52%" stop-color="#17406f"/>
      <stop offset="100%" stop-color="#0c6b68"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef7ff"/>
    </linearGradient>
    <linearGradient id="warmCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf4"/>
      <stop offset="100%" stop-color="#fff1bd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="23" flood-color="#050c18" flood-opacity="0.26"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#091120" flood-opacity="0.18"/>
    </filter>

    <!-- Rammemål matcher skjermbildenes egne sideforhold eksakt, slik at
         ingenting beskjæres bort:
         hovedskjerm 500x1210 (0.41322) → 314x760  (0.41316)
         kode        460x245  (1.87755) → 314x167  (1.88024)
         logg3       500x198  (2.52525) → 500x198  (1:1, uskalert) -->
    <clipPath id="heroScreen">
      <rect x="660" y="155" width="314" height="760" rx="28" ry="28"/>
    </clipPath>
    <clipPath id="kodeScreen">
      <rect x="660" y="943" width="314" height="167" rx="18" ry="18"/>
    </clipPath>
    <clipPath id="loggScreen">
      <rect x="76" y="912" width="500" height="198" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <rect width="1080" height="1315" fill="url(#bg)"/>
  <circle cx="104" cy="162" r="133" fill="#7dd3fc" opacity="0.13"/>
  <circle cx="952" cy="152" r="150" fill="#fde68a" opacity="0.14"/>
  <circle cx="906" cy="1140" r="226" fill="#86efac" opacity="0.12"/>
  <circle cx="442" cy="952" r="108" fill="#bfdbfe" opacity="0.08"/>

  <!-- App-navn, sentrert øverst på hele flaten -->
  <rect x="390" y="44" width="300" height="62" rx="27" ry="27" fill="#ecfeff" opacity="0.96"/>
  <text x="540" y="86" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="33" font-weight="800" fill="#12314d">ENKEL-AO</text>

  <text x="76" y="202" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#f8fbff">
    <tspan x="76" dy="0">Enklere vei inn i</tspan>
    <tspan x="76" dy="64">Artsobservasjoner</tspan>
  </text>

  <text x="78" y="330" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#dce8ff">
    <tspan x="78" dy="0">Enkel-AO erstatter ikke AO. Det er et</tspan>
    <tspan x="78" dy="36">enklere lag oppå, laget for rask</tspan>
    <tspan x="78" dy="36">registrering i felt — på mobil.</tspan>
  </text>

  <g filter="url(#softShadow)">
    <rect x="76" y="440" width="500" height="126" rx="28" ry="28" fill="url(#card)"/>
    <text x="112" y="482" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#122844">GPS finner lokalitetene</text>
    <text x="112" y="518" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#52657a">
      <tspan x="112" dy="0">Hent stedene der du står, og velg riktig</tspan>
      <tspan x="112" dy="25">AO-lokalitet fra lista eller kartet.</tspan>
    </text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="76" y="586" width="500" height="126" rx="28" ry="28" fill="url(#warmCard)"/>
    <text x="112" y="628" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#1f2937">Fellestur: del på jobben</text>
    <text x="112" y="664" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b5f3f">
      <tspan x="112" dy="0">Én kode, én felles liste. Slipp at én må</tspan>
      <tspan x="112" dy="25">være sekretær mens de andre ser på fugl.</tspan>
    </text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="76" y="732" width="500" height="126" rx="28" ry="28" fill="url(#card)"/>
    <text x="112" y="774" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#122844">Varsel ved sjeldne funn</text>
    <text x="112" y="810" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#52657a">
      <tspan x="112" dy="0">Appen sier fra når arten er uvanlig på</tspan>
      <tspan x="112" dy="25">stedet — fra AOs egen vurdering.</tspan>
    </text>
  </g>

  <!-- Hovedskjermbilde -->
  <g filter="url(#shadow)">
    <image href="/Users/kjetil/git/enkel-ao/docs/facebook-reklame-assets/screens/enkel-ao-v15338-hovedskjerm.png"
           x="660" y="155" width="314" height="760"
           preserveAspectRatio="xMidYMin meet" clip-path="url(#heroScreen)"/>
    <rect x="660" y="155" width="314" height="760" rx="28" ry="28" fill="none" stroke="#facc15" stroke-width="5"/>
  </g>

  <!-- Den delte loggen: tre arter, tre ulike personer. Vist i full bredde og
       uskalert, slik at navnene faktisk er lesbare — det er hele poenget. -->
  <g filter="url(#softShadow)">
    <image href="/Users/kjetil/git/enkel-ao/docs/facebook-reklame-assets/screens/enkel-ao-v15338-fellestur-logg3.png"
           x="76" y="912" width="500" height="198"
           preserveAspectRatio="xMidYMin meet" clip-path="url(#loggScreen)"/>
    <rect x="76" y="912" width="500" height="198" rx="18" ry="18" fill="none" stroke="#facc15" stroke-width="4"/>
  </g>

  <!-- Koden gruppa deler. Bunnjustert mot loggen til venstre. -->
  <g filter="url(#softShadow)">
    <image href="/Users/kjetil/git/enkel-ao/docs/facebook-reklame-assets/screens/enkel-ao-v15338-fellestur-kode.png"
           x="660" y="943" width="314" height="167"
           preserveAspectRatio="xMidYMin meet" clip-path="url(#kodeScreen)"/>
    <rect x="660" y="943" width="314" height="167" rx="18" ry="18" fill="none" stroke="#facc15" stroke-width="4"/>
  </g>

  <text x="540" y="1158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#9fc4e8">Lokaliteter og artsdata hentes fra artsobservasjoner.no</text>

  <rect x="76" y="1188" width="928" height="86" rx="30" ry="30" fill="#facc15"/>
  <text x="540" y="1242" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#13233d">ao.efugl.no  •  virker offline, ingen AppStore</text>
</svg>
